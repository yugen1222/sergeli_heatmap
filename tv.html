<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тепловая карта Сергели — ТВ</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef2f7;
  color:#111827;
  overflow:hidden;
}
header{
  height:72px;
  background:#07111f;
  color:white;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
}
.title{
  font-size:28px;
  font-weight:900;
}
.actions{
  display:flex;
  gap:10px;
}
button{
  border:0;
  border-radius:10px;
  padding:12px 16px;
  font-weight:800;
  cursor:pointer;
}
.voice{
  background:#0f766e;
  color:white;
}
.clock{
  font-size:22px;
  font-weight:800;
}
.banner{
  margin:12px 16px 0;
  padding:12px 16px;
  border-radius:12px;
  font-size:22px;
  font-weight:900;
  background:#fee2e2;
  color:#991b1b;
  border:3px solid #dc2626;
}
.hidden{display:none!important}

.grid{
  height:calc(100vh - 96px);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
  padding:16px;
}
.floor{
  border-radius:20px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:white;
  text-align:center;
  box-shadow:0 10px 24px rgba(0,0,0,.16);
  padding:24px;
}
.green{background:#4fbd3d}
.yellow{background:#ffe000;color:#111827}
.red{background:#ff2424;animation:pulse 1.1s infinite}
@keyframes pulse{
  0%,100%{filter:brightness(1)}
  50%{filter:brightness(1.15)}
}
.floor h2{
  margin:0 0 26px;
  font-size:48px;
}
.metrics{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  width:100%;
  margin-bottom:26px;
}
.metric{
  border:3px solid rgba(255,255,255,.95);
  border-radius:18px;
  padding:18px;
  background:rgba(255,255,255,.15);
}
.metric-label{
  font-size:22px;
  font-weight:800;
}
.metric-value{
  font-size:64px;
  font-weight:900;
  margin-top:8px;
}
.status{
  font-size:28px;
  font-weight:900;
  margin:8px 0;
}
.need{
  font-size:27px;
  font-weight:900;
}
.error{
  position:fixed;
  left:20px;
  right:20px;
  bottom:20px;
  background:#fff;
  border:3px solid #dc2626;
  color:#991b1b;
  padding:15px;
  border-radius:12px;
  font-weight:800;
}
@media(max-width:900px){
  body{overflow:auto}
  .grid{grid-template-columns:1fr;height:auto}
}
</style>
</head>

<body>
<header>
  <div class="title">🔥 Тепловая карта Сергели</div>
  <div class="actions">
    <button id="voiceBtn" class="voice">🔊 Включить голос</button>
    <div id="clock" class="clock"></div>
  </div>
</header>

<div id="banner" class="banner hidden"></div>
<main id="grid" class="grid"></main>
<div id="errorBox" class="error hidden"></div>

<script>
(function(){
  var firebaseConfig = {
    apiKey: "AIzaSyDRvsn15ornx30mkwiTlhhlaL3-HT67D_w",
    authDomain: "sergeli-heatmap.firebaseapp.com",
    databaseURL: "https://sergeli-heatmap-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "sergeli-heatmap",
    storageBucket: "sergeli-heatmap.firebasestorage.app",
    messagingSenderId: "587633182406",
    appId: "1:587633182406:web:18b1fc7da7ba9fb8f979c7"
  };

  firebase.initializeApp(firebaseConfig);
  var db = firebase.database();

  var floors = {
    1:{staff:0,guests:0,norm:5},
    2:{staff:0,guests:0,norm:5},
    3:{staff:0,guests:0,norm:5}
  };
  var settings = {yellowLimit:1,redLimit:2,soundEnabled:"Включено",voiceCooldown:300000};

  var voiceUnlocked = false;
  var queue = [];
  var playing = false;
  var lastVoiceTime = {};
  var voices = {
    1:new Audio("./floor1.mp3"),
    2:new Audio("./floor2.mp3"),
    3:new Audio("./floor3.mp3")
  };

  function showError(message){
    var el=document.getElementById("errorBox");
    el.textContent=message;
    el.classList.remove("hidden");
  }

  window.onerror=function(message){
    showError("Ошибка ТВ-режима: "+message);
  };

  function getLoad(d){
    return Number(d.staff)>0 ? Number(d.guests)/Number(d.staff) : 0;
  }

  function getStatus(d){
    var load=getLoad(d);
    var norm=Number(d.norm||1);
    if(load<=norm) return "green";
    if(load<=norm+Number(settings.yellowLimit||0)) return "yellow";
    return "red";
  }

  function statusText(status){
    if(status==="red") return "Критичная";
    if(status==="yellow") return "Высокая";
    return "Нормальная";
  }

  function missing(d){
    var norm=Math.max(1,Number(d.norm||1));
    return Math.max(0,Math.ceil(Number(d.guests||0)/norm)-Number(d.staff||0));
  }

  function render(){
    var grid=document.getElementById("grid");
    var reds=[];
    var html="";

    for(var i=1;i<=3;i++){
      var d=floors[i]||{staff:0,guests:0,norm:5};
      var status=getStatus(d);
      var need=missing(d);

      if(status==="red"){
        reds.push({floor:i,missing:need});
        enqueueVoice(i);
      }

      html +=
        '<section class="floor '+status+'">'+
          '<h2>'+i+' этаж</h2>'+
          '<div class="metrics">'+
            '<div class="metric">'+
              '<div class="metric-label">👤 Сотрудники</div>'+
              '<div class="metric-value">'+Number(d.staff||0)+'</div>'+
            '</div>'+
            '<div class="metric">'+
              '<div class="metric-label">👥 Гости</div>'+
              '<div class="metric-value">'+Number(d.guests||0)+'</div>'+
            '</div>'+
          '</div>'+
          '<div class="status">Нагрузка: '+statusText(status)+'</div>'+
          '<div class="need">'+(status==="green"?"Сотрудников хватает":need===1?"Нужен 1 сотрудник":"Нужно "+need+" сотрудника")+'</div>'+
        '</section>';
    }

    grid.innerHTML=html;

    var banner=document.getElementById("banner");
    if(reds.length){
      banner.classList.remove("hidden");
      banner.innerHTML="🚨 "+reds.map(function(x){
        return x.floor+" этаж: не хватает +"+x.missing;
      }).join(" • ");
    }else{
      banner.classList.add("hidden");
    }
  }

  function enqueueVoice(floor){
    if(!voiceUnlocked || settings.soundEnabled==="Выключено") return;

    var now=Date.now();
    var cooldown=Number(settings.voiceCooldown||300000);

    if(lastVoiceTime[floor] && now-lastVoiceTime[floor]<cooldown) return;
    if(queue.indexOf(floor)===-1) queue.push(floor);

    playNext();
  }

  function playNext(){
    if(playing || !queue.length) return;

    var floor=queue.shift();
    var audio=voices[floor];

    playing=true;
    lastVoiceTime[floor]=Date.now();
    audio.currentTime=0;

    audio.onended=function(){
      playing=false;
      setTimeout(playNext,1000);
    };

    audio.onerror=function(){
      playing=false;
      playNext();
    };

    audio.play().catch(function(){
      playing=false;
    });
  }

  document.getElementById("voiceBtn").onclick=function(){
    var btn=this;
    var audio=voices[1];

    audio.currentTime=0;
    audio.play().then(function(){
      voiceUnlocked=true;
      btn.textContent="🔊 Голос включён";
    }).catch(function(err){
      showError("Телевизор заблокировал звук: "+err.message);
    });
  };

  db.ref("sergeli_heatmap/floors").on("value",function(snapshot){
    if(snapshot.exists()) floors=snapshot.val();
    render();
  },function(error){
    showError("Firebase floors: "+error.message);
  });

  db.ref("sergeli_heatmap/settings").on("value",function(snapshot){
    if(snapshot.exists()){
      var data=snapshot.val();
      for(var key in data) settings[key]=data[key];
    }
    render();
  },function(error){
    showError("Firebase settings: "+error.message);
  });

  setInterval(function(){
    document.getElementById("clock").textContent=
      new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});
  },1000);
})();
</script>
</body>
</html>
